# API contract del feed (OpenAPI 3): sottoinsieme ufficiale della Forem API V1 di DEV.to.
# Si esplora con una Swagger UI ospitata, senza installare nulla (link nel README).
openapi: 3.0.3
info:
  title: Forem API V1 (sottoinsieme per il feed)
  version: 1.0.0
  description: 'Estratto dall''API contract ufficiale di Forem/DEV.to (https://github.com/forem/forem/blob/main/swagger/v1/api_v1.json): solo la lettura degli articoli. Nel progetto, web/data/articles.json è la risposta di GET /api/articles salvata il 22/11/2026 (54 articoli).'
servers:
- url: https://dev.to
  description: DEV.to dal vivo (Try it out chiama il servizio reale)
paths:
  "/api/articles":
    get:
      summary: Published articles
      tags:
      - articles
      description: |-
        This endpoint allows the client to retrieve a list of articles.

        "Articles" are all the posts that users create on DEV/Forem that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but are referred to as articles within the code.

        By default it will return featured, published articles ordered by descending popularity.

        It supports pagination, each page will contain `30` articles by default.

        ### Query Parameter Usage Tips:
        - **Filtering by Tags**:
          - Use `tag` to filter articles containing a single exact tag (e.g. `tag=discuss`).
          - Use `tags` to retrieve articles containing *any* of the comma-separated list of tags (e.g. `tags=javascript,css`).
          - Use `tags_exclude` to filter out articles containing any of the comma-separated list of tags (e.g. `tags_exclude=node,java`).
        - **Filtering by User / Organization**:
          - Use `username` to retrieve articles belonging to a specific User or Organization. Articles are returned in reverse chronological publication order.
        - **State Options**:
          - Use `state=fresh` to fetch fresh articles.
          - Use `state=rising` to fetch rising/trending articles.
          - Combine `state=all` with `username` to fetch up to `1000` articles (both published and unpublished) from that user/organization in a single page.
        - **Top / Popularity**:
          - Use `top=N` to return the most popular articles published in the last `N` days (e.g. `top=7` for top articles of the week, `top=30` for top of the month). This parameter can be combined with `tag` to find top articles in a specific niche.
        - **Collections**:
          - Use `collection_id` to retrieve articles belonging to a specific collection/series, sorted chronologically.
        - **Pagination Limits**:
          - Unauthenticated requests are limited to `page <= 1000` and a maximum pagination offset (`(page - 1) * per_page`) of `30000`. Provide a valid `api-key` header to paginate deeper.
      operationId: getArticles
      parameters:
      - "$ref": "#/components/parameters/pageParam"
      - "$ref": "#/components/parameters/perPageParam30to1000"
      - name: tag
        in: query
        required: false
        description: |-
          Using this parameter will retrieve articles that contain the requested tag. Articles
          will be ordered by descending popularity.This parameter can be used in conjuction with `top`.
        schema:
          type: string
        example: discuss
      - name: tags
        in: query
        required: false
        description: |-
          Using this parameter will retrieve articles with any of the comma-separated tags.
          Articles will be ordered by descending popularity.
        schema:
          type: string
        example: javascript, css
      - name: tags_exclude
        in: query
        required: false
        description: |-
          Using this parameter will retrieve articles that do _not_ contain _any_
          of comma-separated tags. Articles will be ordered by descending popularity.
        schema:
          type: string
        example: node, java
      - name: username
        in: query
        required: false
        description: |-
          Using this parameter will retrieve articles belonging
                      to a User or Organization ordered by descending publication date.
                      If `state=all` the number of items returned will be `1000` instead of the default `30`.
                      This parameter can be used in conjuction with `state`.
        schema:
          type: string
        example: ben
      - name: state
        in: query
        required: false
        description: |-
          Using this parameter will allow the client to check which articles are fresh or rising.
                      If `state=fresh` the server will return fresh articles.
                      If `state=rising` the server will return rising articles.
                      This param can be used in conjuction with `username`, only if set to `all`.
        schema:
          type: string
          enum:
          - fresh
          - rising
          - all
        example: fresh
      - name: top
        in: query
        required: false
        description: |-
          Using this parameter will allow the client to return the most popular articles
          in the last `N` days (clamped to a maximum of `730` days).
          `top` indicates the number of days since publication of the articles returned.
          This param can be used in conjuction with `tag`.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 730
        example: 2
      - name: collection_id
        in: query
        required: false
        description: |-
          Adding this will allow the client to return the list of articles
          belonging to the requested collection, ordered by ascending publication date.
        schema:
          type: integer
          format: int32
        example: 99
      responses:
        '200':
          description: A List of Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ArticleIndex"
  "/api/articles/{id}":
    get:
      summary: Published article by id
      tags:
      - articles
      description: |-
        This endpoint allows the client to retrieve a single published article given its unique numerical `id`.

        ### Integration Tip:
        - Returns the complete serialized article object including its HTML/markdown representation, tags, and author profile details.
        - To retrieve an article using its URL path structure instead of its numeric ID, use the `/api/articles/{username}/{slug}` endpoint.
      operationId: getArticleById
      parameters:
      - name: id
        in: path
        required: true
        description: The unique numerical ID of the published article.
        schema:
          type: integer
      responses:
        '200':
          description: An Article
          content:
            application/json:
              schema:
                type: object
                items:
                  "$ref": "#/components/schemas/ArticleIndex"
        '404':
          description: Article Not Found
components:
  parameters:
    pageParam:
      in: query
      name: page
      required: false
      description: Pagination page
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    perPageParam30to1000:
      in: query
      name: per_page
      required: false
      description: Page size (the number of items to return per page). The default maximum value can be overridden by "API_PER_PAGE_MAX" environment variable.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 30
  schemas:
    ArticleIndex:
      description: Representation of an article or post returned in a list
      type: object
      properties:
        type_of:
          type: string
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        cover_image:
          type: string
          format: url
          nullable: true
        readable_publish_date:
          type: string
        social_image:
          type: string
          format: url
        tag_list:
          type: array
          items:
            type: string
        tags:
          type: string
        slug:
          type: string
        path:
          type: string
          format: path
        url:
          type: string
          format: url
        canonical_url:
          type: string
          format: url
        positive_reactions_count:
          type: integer
          format: int32
        public_reactions_count:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        crossposted_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
        last_comment_at:
          type: string
          format: date-time
        published_timestamp:
          description: Crossposting or published date time
          type: string
          format: date-time
        reading_time_minutes:
          description: Reading time, in minutes
          type: integer
          format: int32
        ai_disclosure_level:
          type: string
          enum:
          - not_disclosed
          - no_ai
          - some_ai
          - fully_autonomous
          description: Level of AI tooling usage disclosure
        ai_disclosure_label:
          type: string
          description: Human-readable label of AI disclosure
        user:
          "$ref": "#/components/schemas/SharedUser"
        flare_tag:
          "$ref": "#/components/schemas/ArticleFlareTag"
        organization:
          "$ref": "#/components/schemas/SharedOrganization"
      required:
      - type_of
      - id
      - title
      - description
      - cover_image
      - readable_publish_date
      - social_image
      - tag_list
      - tags
      - slug
      - path
      - url
      - canonical_url
      - comments_count
      - positive_reactions_count
      - public_reactions_count
      - created_at
      - edited_at
      - crossposted_at
      - published_at
      - last_comment_at
      - published_timestamp
      - user
      - reading_time_minutes
    SharedUser:
      description: The resource creator
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        twitter_username:
          type: string
          nullable: true
        github_username:
          type: string
          nullable: true
        website_url:
          type: string
          format: url
          nullable: true
        profile_image:
          description: Profile image (640x640)
          type: string
        profile_image_90:
          description: Profile image (90x90)
          type: string
    ArticleFlareTag:
      description: Flare tag of the article
      type: object
      properties:
        name:
          type: string
        bg_color_hex:
          description: Background color (hexadecimal)
          type: string
          nullable: true
        text_color_hex:
          description: Text color (hexadecimal)
          type: string
          nullable: true
    SharedOrganization:
      description: The organization the resource belongs to
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        slug:
          type: string
        profile_image:
          description: Profile image (640x640)
          type: string
          format: url
        profile_image_90:
          description: Profile image (90x90)
          type: string
          format: url
